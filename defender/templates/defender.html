<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🛡️ Defender Honeypot — LLM Cyber Simulation</title>
  <style>
    :root {
      --bg:     #0a0f0a;
      --panel:  #0d1310;
      --border: #1a2e1f;
      --red:    #ff4c4c;
      --orange: #ff8c42;
      --green:  #39d98a;
      --lime:   #a3e635;
      --cyan:   #38bdf8;
      --yellow: #fbbf24;
      --muted:  #4b6355;
      --text:   #d1fae5;
      --accent: #34d399;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--bg); color:var(--text);
      font-family:'Cascadia Code','Fira Code',Consolas,monospace;
      font-size:13px; height:100vh; display:flex; flex-direction:column;
    }

    header {
      background:#060e08; border-bottom:1px solid var(--border);
      padding:10px 20px; display:flex; align-items:center; gap:16px; flex-shrink:0;
    }
    .logo { font-size:18px; font-weight:700; color:var(--accent); letter-spacing:1px; }
    .logo span { color:var(--text); }
    .badge { padding:3px 10px; border-radius:4px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; }
    .badge-green { background:rgba(52,211,153,.12); color:var(--accent); border:1px solid rgba(52,211,153,.3); }
    .badge-red   { background:rgba(255,76,76,.12);  color:var(--red);    border:1px solid rgba(255,76,76,.3); }
    .badge-muted { background:rgba(75,99,85,.2);    color:var(--muted);  border:1px solid var(--border); }
    header nav { margin-left:auto; display:flex; gap:10px; }
    header nav a {
      color:var(--muted); text-decoration:none; font-size:12px;
      padding:4px 12px; border-radius:4px; border:1px solid var(--border); transition:all .15s;
    }
    header nav a:hover { color:var(--text); border-color:var(--accent); }
    header nav a.active { color:var(--accent); border-color:var(--accent); }

    .statusbar {
      display:flex; gap:24px; align-items:center;
      padding:7px 20px; background:#08100a; border-bottom:1px solid var(--border); font-size:11px; flex-shrink:0;
    }
    .stat { display:flex; align-items:center; gap:6px; }
    .stat .label { color:var(--muted); }
    .stat .value { color:var(--yellow); font-weight:600; }
    #conn-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); transition:background .3s; }
    #conn-dot.live { background:var(--accent); box-shadow:0 0 6px var(--accent); }

    .btn-sm {
      background:none; border:1px solid var(--border); color:var(--muted);
      padding:2px 10px; border-radius:4px; cursor:pointer; font-size:11px;
      font-family:inherit; transition:all .15s;
    }
    .btn-sm:hover { color:var(--text); border-color:var(--accent); }

    main { flex:1; overflow:hidden; padding:16px; display:flex; flex-direction:column; gap:16px; }

    .terminal-card {
      background:var(--panel); border:1px solid var(--border);
      border-radius:8px; display:flex; flex-direction:column; overflow:hidden; flex:1;
    }
    .card-header {
      display:flex; align-items:center; gap:10px; padding:8px 14px;
      background:#060e08; border-bottom:1px solid var(--border); flex-shrink:0;
    }
    .card-header .dots span { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:5px; }
    .dot-red { background:#ff5f57; } .dot-yellow { background:#febc2e; } .dot-green { background:#28c840; }
    .card-title { font-size:12px; color:var(--muted); margin-left:4px; flex:1; }
    .card-actions { display:flex; gap:8px; }

    #terminal { flex:1; overflow-y:auto; padding:14px 16px; line-height:1.65; scroll-behavior:smooth; }

    /* ── Session container ── */
    .session-block {
      border:1px solid var(--border); border-radius:8px;
      margin-bottom:16px; overflow:hidden;
      animation:fadeIn .25s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

    .session-header {
      display:flex; align-items:center; gap:10px;
      padding:8px 14px; background:rgba(52,211,153,.06);
      border-bottom:1px solid var(--border);
      cursor:pointer; user-select:none;
    }
    .session-header:hover { background:rgba(52,211,153,.11); }
    .session-toggle { font-size:10px; color:var(--accent); transition:transform .2s; }
    .session-toggle.collapsed { transform:rotate(-90deg); }
    .session-title { font-size:12px; font-weight:700; color:var(--accent); flex:1; }
    .session-meta  { font-size:11px; color:var(--muted); }
    .session-body  { padding:10px 14px; }
    .session-body.hidden { display:none; }

    /* ── Turn blocks ── */
    .turn-block {
      border:1px solid rgba(255,76,76,.15); border-radius:6px;
      margin-bottom:10px; overflow:hidden;
    }
    .turn-header {
      display:flex; align-items:center; gap:8px;
      padding:6px 12px; background:rgba(255,76,76,.05);
      border-bottom:1px solid rgba(255,76,76,.1);
      cursor:pointer; user-select:none;
    }
    .turn-header:hover { background:rgba(255,76,76,.1); }
    .turn-toggle { font-size:10px; color:var(--red); transition:transform .2s; }
    .turn-toggle.collapsed { transform:rotate(-90deg); }
    .turn-label { font-size:11px; font-weight:700; color:var(--red); }
    .trap-tag {
      font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
      color:var(--accent); background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.2);
      padding:2px 7px; border-radius:3px;
    }
    .turn-cmd-preview { font-size:11px; color:var(--muted); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:380px; }
    .turn-time { font-size:10px; color:var(--muted); margin-left:auto; }
    .turn-body { padding:8px 12px; }
    .turn-body.hidden { display:none; }

    .incoming-block {
      background:#07120a; border-left:3px solid var(--red);
      border-radius:0 6px 6px 0; padding:8px 12px; margin-bottom:6px;
    }
    .incoming-prompt { color:#f87171; }
    .incoming-cmd    { color:#fca5a5; font-weight:600; }

    .fake-block {
      background:#060f08; border-left:3px solid var(--accent);
      border-radius:0 6px 6px 0; padding:8px 12px;
      color:#6ee7b7; white-space:pre-wrap; word-break:break-word;
      max-height:300px; overflow-y:auto;
    }
    .fake-label {
      display:flex; align-items:center; gap:6px;
      font-size:11px; font-weight:700; color:var(--accent);
      margin-bottom:4px;
    }

    .auth-block {
      padding:6px 12px; border-radius:6px;
      background:rgba(255,76,76,.07); border:1px solid rgba(255,76,76,.2);
      color:var(--red); display:flex; align-items:center; gap:10px; font-size:12px;
      margin-bottom:8px;
    }
    .conn-block {
      padding:6px 12px; border-radius:6px; font-size:12px;
      background:rgba(52,211,153,.07); border:1px solid rgba(52,211,153,.2);
      color:var(--accent); display:flex; align-items:center; gap:8px; margin-bottom:8px;
    }
    .disc-block {
      padding:6px 12px; border-radius:6px; font-size:12px;
      background:rgba(75,99,85,.15); border:1px solid var(--border);
      color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:8px;
    }

    .thinking-row { display:flex; align-items:center; gap:8px; color:var(--lime); margin-top:6px; }
    .spinner {
      width:12px; height:12px; border:2px solid var(--muted);
      border-top-color:var(--lime); border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">🛡️ DEFENDER<span> HONEYPOT</span></div>
  <span class="badge badge-green">BLUE TEAM</span>
  <span class="badge badge-muted" id="model-badge">Model: —</span>
  <span class="badge badge-red" id="alert-badge" style="display:none">⚠️ ATTACKER ACTIVE</span>
  <div style="display:flex;align-items:center;gap:6px;margin-left:8px">
    <div id="conn-dot"></div>
    <span style="font-size:11px;color:var(--muted)" id="conn-label">Connecting…</span>
  </div>
  <nav>
    <a href="/" class="active">Terminal</a>
    <a href="/logview">Log Viewer</a>
  </nav>
</header>

<div class="statusbar">
  <div class="stat"><span class="label">Commands Trapped</span><span class="value" id="stat-cmds">0</span></div>
  <div class="stat"><span class="label">Active Sessions</span><span class="value" id="stat-sessions">0</span></div>
  <div class="stat"><span class="label">Auth Attempts</span><span class="value" id="stat-auths">0</span></div>
  <div class="stat"><span class="label">Attacker IP</span><span class="value" id="stat-peer" style="color:var(--red)">—</span></div>
  <div class="stat"><span class="label">Honeypot Status</span><span class="value" id="stat-status" style="color:var(--accent)">Listening</span></div>
  <div class="stat" style="margin-left:auto">
    <button class="btn-sm" onclick="collapseAll()">Collapse All</button>
    <button class="btn-sm" style="margin-left:4px" onclick="expandAll()">Expand All</button>
  </div>
</div>

<main>
  <div class="terminal-card">
    <div class="card-header">
      <div class="dots">
        <span class="dot-red"></span><span class="dot-yellow"></span><span class="dot-green"></span>
      </div>
      <span class="card-title">webserver-prod — Honeypot Intercept Log</span>
      <div class="card-actions">
        <button class="btn-sm" onclick="document.getElementById('terminal').innerHTML='';peerSessions={}">Clear</button>
        <button class="btn-sm" onclick="autoScroll=!autoScroll;this.textContent=autoScroll?'Auto↓':'Manual'">Auto↓</button>
      </div>
    </div>
    <div id="terminal"></div>
  </div>
</main>

<script>
  let cmdCount   = 0;
  let authCount  = 0;
  let activeSess = 0;
  let autoScroll = true;
  let peerSessions = {};   // peer -> { body, cmdCount, sessionIdx }
  let sessionSeq = 0;

  const term = document.getElementById('terminal');
  const dot  = document.getElementById('conn-dot');

  function ts(iso) { return iso ? new Date(iso).toLocaleTimeString() : ''; }
  function esc(s)  { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function scrollBottom() { if (autoScroll) term.scrollTop = term.scrollHeight; }

  function toggleBlock(bodyId, toggleId) {
    const body   = document.getElementById(bodyId);
    const toggle = document.getElementById(toggleId);
    if (!body) return;
    const hidden = body.classList.toggle('hidden');
    if (toggle) toggle.classList.toggle('collapsed', hidden);
  }
  function collapseAll() {
    document.querySelectorAll('.session-body,.turn-body').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.session-toggle,.turn-toggle').forEach(el => el.classList.add('collapsed'));
  }
  function expandAll() {
    document.querySelectorAll('.session-body,.turn-body').forEach(el => el.classList.remove('hidden'));
    document.querySelectorAll('.session-toggle,.turn-toggle').forEach(el => el.classList.remove('collapsed'));
  }

  // ── Session block per peer ─────────────────────────────────
  function getOrCreateSession(peer, timestamp) {
    if (peerSessions[peer]) return peerSessions[peer];

    sessionSeq++;
    const id     = 'sess-' + sessionSeq;
    const bodyId = id + '-body';
    const togId  = id + '-tog';

    const html = `
      <div class="session-block" id="${id}">
        <div class="session-header" onclick="toggleBlock('${bodyId}','${togId}')">
          <span class="session-toggle" id="${togId}">▼</span>
          <span class="session-title">🔗 Attacker Session</span>
          <span class="session-meta" style="color:var(--red)">${esc(peer)}</span>
          <span class="session-meta" style="margin-left:8px">${ts(timestamp)}</span>
        </div>
        <div class="session-body" id="${bodyId}"></div>
      </div>`;
    term.insertAdjacentHTML('beforeend', html);
    scrollBottom();

    peerSessions[peer] = { body: document.getElementById(bodyId), cmdCount: 0 };
    return peerSessions[peer];
  }

  // ── Turn block per command ─────────────────────────────────
  function createTurn(sessionBody, turnId, command, timestamp) {
    const bodyId = 'turn-body-' + turnId;
    const togId  = 'turn-tog-'  + turnId;
    const html = `
      <div class="turn-block" id="turn-${turnId}">
        <div class="turn-header" onclick="toggleBlock('${bodyId}','${togId}')">
          <span class="turn-toggle" id="${togId}">▼</span>
          <span class="turn-label">CMD #${turnId}</span>
          <span class="trap-tag">TRAPPED</span>
          <span class="turn-cmd-preview">$ ${esc(command)}</span>
          <span class="turn-time">${ts(timestamp)}</span>
        </div>
        <div class="turn-body" id="${bodyId}">
          <div class="incoming-block">
            <span class="incoming-prompt">admin@webserver-prod:~$ </span>
            <span class="incoming-cmd">${esc(command)}</span>
          </div>
          <div id="turn-think-${turnId}" class="thinking-row">
            <div class="spinner"></div> Generating deceptive response…
          </div>
        </div>
      </div>`;
    sessionBody.insertAdjacentHTML('beforeend', html);
    scrollBottom();
  }

  // ── Main event handler ─────────────────────────────────────
  function appendEvent(ev) {
    const type = ev.event;
    if (type === 'ping') return;

    if (type === 'connection') {
      activeSess++;
      document.getElementById('stat-sessions').textContent = activeSess;
      document.getElementById('stat-peer').textContent     = ev.peer || '—';
      document.getElementById('stat-status').textContent   = 'Under Attack 🔴';
      document.getElementById('stat-status').style.color   = 'var(--red)';
      document.getElementById('alert-badge').style.display = 'inline-flex';

      const sess = getOrCreateSession(ev.peer, ev.timestamp);
      sess.body.insertAdjacentHTML('beforeend',
        `<div class="conn-block">🔗 <strong>Connected</strong> from <strong>${esc(ev.peer)}</strong>
          <span style="font-size:10px;color:var(--muted);margin-left:auto">${ts(ev.timestamp)}</span>
        </div>`);
      return;
    }

    if (type === 'auth_attempt') {
      authCount++;
      document.getElementById('stat-auths').textContent = authCount;
      const peer = ev.peer || '_unknown_';
      const sess = peerSessions[peer] || getOrCreateSession(peer, ev.timestamp);
      sess.body.insertAdjacentHTML('beforeend',
        `<div class="auth-block">🔑 <strong>Auth</strong> user:<strong>${esc(ev.username)}</strong>
          pass:<strong>${esc(ev.password)}</strong>
          <span style="font-size:10px;color:var(--muted);margin-left:auto">${ts(ev.timestamp)}</span>
        </div>`);
      scrollBottom();
      return;
    }

    if (type === 'command_received') {
      cmdCount++;
      document.getElementById('stat-cmds').textContent = cmdCount;
      const peer = ev.peer || '_unknown_';
      const sess = peerSessions[peer] || getOrCreateSession(peer, ev.timestamp);
      sess.cmdCount++;
      const turnId = peer.replace(/[^a-z0-9]/gi,'_') + '_' + sess.cmdCount;
      sess._lastTurnId = turnId;   // remember for fake_output pairing
      createTurn(sess.body, turnId, ev.command, ev.timestamp);
      return;
    }

    if (type === 'fake_output_sent') {
      const peer = ev.peer || '_unknown_';
      const sess = peerSessions[peer];
      if (!sess || !sess._lastTurnId) return;
      const turnId  = sess._lastTurnId;
      const thinkEl = document.getElementById('turn-think-' + turnId);
      if (thinkEl) thinkEl.remove();
      const bodyEl = document.getElementById('turn-body-' + turnId);
      if (bodyEl) {
        bodyEl.insertAdjacentHTML('beforeend', `
          <div class="fake-label">🎭 FAKE OUTPUT SENT TO ATTACKER</div>
          <div class="fake-block">${esc(ev.output)}</div>`);
        if (autoScroll) bodyEl.scrollIntoView({ behavior:'smooth', block:'end' });
      }
      return;
    }

    if (type === 'disconnection') {
      activeSess = Math.max(0, activeSess - 1);
      document.getElementById('stat-sessions').textContent = activeSess;
      if (activeSess === 0) {
        document.getElementById('stat-status').textContent = 'Listening';
        document.getElementById('stat-status').style.color = 'var(--accent)';
        document.getElementById('alert-badge').style.display = 'none';
      }
      const peer = ev.peer || '_unknown_';
      const sess = peerSessions[peer];
      if (sess) {
        sess.body.insertAdjacentHTML('beforeend',
          `<div class="disc-block">🔌 <strong>Disconnected</strong> — ${esc(ev.peer)} &nbsp;
            Commands: <strong>${ev.total_commands}</strong>
            <span style="font-size:10px;color:var(--muted);margin-left:auto">${ts(ev.timestamp)}</span>
          </div>`);
        scrollBottom();
        delete peerSessions[peer];
      }
      return;
    }
  }

  function connect() {
    const es = new EventSource('/stream');
    es.onopen = () => {
      dot.classList.add('live');
      document.getElementById('conn-label').textContent = 'Live';
    };
    es.onmessage = (e) => {
      try { appendEvent(JSON.parse(e.data)); } catch(_) {}
    };
    es.onerror = () => {
      dot.classList.remove('live');
      document.getElementById('conn-label').textContent = 'Reconnecting…';
      es.close();
      setTimeout(connect, 3000);
    };
  }

  connect();
</script>
</body>
</html>
