<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>⚔️ Attacker Terminal — LLM Cyber Simulation</title>
  <style>
    :root {
      --bg:       #0d0d0d;
      --panel:    #111318;
      --border:   #1e2433;
      --red:      #ff4c4c;
      --orange:   #ff8c42;
      --green:    #39d98a;
      --cyan:     #38bdf8;
      --yellow:   #fbbf24;
      --muted:    #4b5563;
      --text:     #e2e8f0;
      --prompt:   #f472b6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    header {
      background: #0a0e1a;
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    header .logo { font-size: 18px; font-weight: 700; color: var(--red); letter-spacing: 1px; }
    header .logo span { color: var(--text); }
    .badge {
      padding: 3px 10px; border-radius: 4px; font-size: 11px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
    }
    .badge-red   { background: rgba(255,76,76,.15);  color: var(--red);   border: 1px solid rgba(255,76,76,.3); }
    .badge-green { background: rgba(57,217,138,.1);  color: var(--green); border: 1px solid rgba(57,217,138,.3); }
    .badge-muted { background: rgba(75,85,99,.2);    color: var(--muted); border: 1px solid var(--border); }
    header nav { margin-left: auto; display: flex; gap: 10px; }
    header nav a {
      color: var(--muted); text-decoration: none; font-size: 12px;
      padding: 4px 12px; border-radius: 4px; border: 1px solid var(--border); transition: all .15s;
    }
    header nav a:hover { color: var(--text); border-color: var(--cyan); }
    header nav a.active { color: var(--cyan); border-color: var(--cyan); }

    /* ── Status bar ── */
    .statusbar {
      display: flex; gap: 24px; align-items: center;
      padding: 7px 20px; background: #0c1020;
      border-bottom: 1px solid var(--border); font-size: 11px; flex-shrink: 0;
    }
    .statusbar .stat { display: flex; align-items: center; gap: 6px; }
    .statusbar .stat .label { color: var(--muted); }
    .statusbar .stat .value { color: var(--yellow); font-weight: 600; }
    #conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background .3s; }
    #conn-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }

    /* ── Main layout ── */
    main { flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    /* ── Terminal card ── */
    .terminal-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; flex: 1;
    }
    .card-header {
      display: flex; align-items: center; gap: 10px; padding: 8px 14px;
      background: #0c1020; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .card-header .dots span { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; }
    .dot-red    { background: #ff5f57; }
    .dot-yellow { background: #febc2e; }
    .dot-green  { background: #28c840; }
    .card-title { font-size: 12px; color: var(--muted); margin-left: 4px; flex: 1; }
    .card-actions { display: flex; gap: 8px; }
    .btn-sm {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 2px 10px; border-radius: 4px; cursor: pointer; font-size: 11px;
      font-family: inherit; transition: all .15s;
    }
    .btn-sm:hover { color: var(--text); border-color: var(--cyan); }

    #terminal { flex: 1; overflow-y: auto; padding: 14px 16px; line-height: 1.65; scroll-behavior: smooth; }

    /* ── Session (per-attack-session) container ── */
    .session-block {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
      animation: fadeIn .25s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

    .session-header {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; background: rgba(56,189,248,.07);
      border-bottom: 1px solid var(--border);
      cursor: pointer; user-select: none;
    }
    .session-header:hover { background: rgba(56,189,248,.12); }
    .session-toggle { font-size: 10px; color: var(--cyan); transition: transform .2s; }
    .session-toggle.collapsed { transform: rotate(-90deg); }
    .session-title { font-size: 12px; font-weight: 700; color: var(--cyan); flex: 1; }
    .session-meta  { font-size: 11px; color: var(--muted); }
    .session-body  { padding: 10px 14px; }
    .session-body.hidden { display: none; }

    /* ── Turn blocks ── */
    .turn-block {
      border: 1px solid rgba(255,140,66,.15);
      border-radius: 6px; margin-bottom: 10px; overflow: hidden;
    }
    .turn-header {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; background: rgba(255,140,66,.06);
      border-bottom: 1px solid rgba(255,140,66,.1);
      cursor: pointer; user-select: none;
    }
    .turn-header:hover { background: rgba(255,140,66,.12); }
    .turn-toggle { font-size: 10px; color: var(--orange); transition: transform .2s; }
    .turn-toggle.collapsed { transform: rotate(-90deg); }
    .turn-label { font-size: 11px; font-weight: 700; color: var(--orange); }
    .turn-cmd-preview { font-size: 11px; color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 420px; }
    .turn-time  { font-size: 10px; color: var(--muted); margin-left: auto; }
    .turn-body  { padding: 8px 12px; }
    .turn-body.hidden { display: none; }

    /* command / output blocks */
    .cmd-block {
      background: #0a0e1a; border-left: 3px solid var(--red);
      border-radius: 0 6px 6px 0; padding: 8px 12px; margin-bottom: 6px;
    }
    .cmd-prompt { color: var(--prompt); }
    .cmd-text   { color: var(--orange); font-weight: 600; }

    .out-block {
      background: #080c18; border-left: 3px solid var(--muted);
      border-radius: 0 6px 6px 0; padding: 8px 12px;
      color: #94a3b8; white-space: pre-wrap; word-break: break-word;
      max-height: 300px; overflow-y: auto;
    }

    /* status events */
    .status-block {
      padding: 6px 12px; border-radius: 6px; font-size: 12px;
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .status-session  { background: rgba(56,189,248,.08); border: 1px solid rgba(56,189,248,.2); color: var(--cyan); }
    .status-complete { background: rgba(57,217,138,.08); border: 1px solid rgba(57,217,138,.2); color: var(--green); }

    .thinking-row { display: flex; align-items: center; gap: 8px; color: var(--yellow); margin-top: 6px; }
    .spinner {
      width: 12px; height: 12px; border: 2px solid var(--muted);
      border-top-color: var(--yellow); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">⚔️ ATTACKER<span> CONSOLE</span></div>
  <span class="badge badge-red">RED TEAM</span>
  <span class="badge badge-muted" id="model-badge">Model: —</span>
  <span class="badge badge-muted" id="target-badge">Target: —</span>
  <div style="display:flex;align-items:center;gap:6px;margin-left:8px">
    <div id="conn-dot"></div>
    <span style="font-size:11px;color:var(--muted)" id="conn-label">Connecting…</span>
  </div>
  <nav>
    <a href="/" class="active">Terminal</a>
    <a href="/logview">Log Viewer</a>
  </nav>
</header>

<div class="statusbar">
  <div class="stat"><span class="label">Turn</span><span class="value" id="stat-turn">—</span></div>
  <div class="stat"><span class="label">Commands Sent</span><span class="value" id="stat-cmds">0</span></div>
  <div class="stat"><span class="label">Target</span><span class="value" id="stat-target">—</span></div>
  <div class="stat"><span class="label">Status</span><span class="value" id="stat-status">Idle</span></div>
  <div class="stat" style="margin-left:auto">
    <span class="label">Scenario</span>
    <span class="value" id="stat-scenario" style="color:var(--cyan);max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span>
  </div>
  <div class="stat" style="margin-left:8px">
    <button class="btn-sm" onclick="collapseAll()">Collapse All</button>
    <button class="btn-sm" style="margin-left:4px" onclick="expandAll()">Expand All</button>
  </div>
</div>

<main>
  <div class="terminal-card">
    <div class="card-header">
      <div class="dots">
        <span class="dot-red"></span><span class="dot-yellow"></span><span class="dot-green"></span>
      </div>
      <span class="card-title">attacker@redteam — LLM Attack Session</span>
      <div class="card-actions">
        <button class="btn-sm" onclick="document.getElementById('terminal').innerHTML='';sessions={}">Clear</button>
        <button class="btn-sm" onclick="autoScroll=!autoScroll;this.textContent=autoScroll?'Auto↓':'Manual'">Auto↓</button>
      </div>
    </div>
    <div id="terminal"></div>
  </div>
</main>

<script>
  let cmdCount   = 0;
  let autoScroll = true;
  let sessions   = {};          // sessionId -> { el, turnCount }
  let currentSession = null;    // id of active session block
  const term = document.getElementById('terminal');
  const dot  = document.getElementById('conn-dot');

  function ts(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString();
  }
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function scrollBottom() {
    if (autoScroll) term.scrollTop = term.scrollHeight;
  }

  // ── Collapse / Expand helpers ──────────────────────────────
  function toggleBlock(bodyId, toggleId) {
    const body   = document.getElementById(bodyId);
    const toggle = document.getElementById(toggleId);
    if (!body) return;
    const hidden = body.classList.toggle('hidden');
    if (toggle) toggle.classList.toggle('collapsed', hidden);
  }

  function collapseAll() {
    document.querySelectorAll('.session-body,.turn-body').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.session-toggle,.turn-toggle').forEach(el => el.classList.add('collapsed'));
  }
  function expandAll() {
    document.querySelectorAll('.session-body,.turn-body').forEach(el => el.classList.remove('hidden'));
    document.querySelectorAll('.session-toggle,.turn-toggle').forEach(el => el.classList.remove('collapsed'));
  }

  // ── Create a new session block ─────────────────────────────
  function createSession(id, scenario, target, timestamp) {
    const bodyId   = 'sess-body-' + id;
    const toggleId = 'sess-tog-' + id;
    const html = `
      <div class="session-block" id="session-${id}">
        <div class="session-header" onclick="toggleBlock('${bodyId}','${toggleId}')">
          <span class="session-toggle" id="${toggleId}">▼</span>
          <span class="session-title">🚀 Attack Session</span>
          <span class="session-meta">${esc(scenario)}</span>
          <span class="session-meta" style="color:var(--red);margin-left:8px">→ ${esc(target)}</span>
          <span class="session-meta" style="margin-left:8px">${ts(timestamp)}</span>
        </div>
        <div class="session-body" id="${bodyId}"></div>
      </div>`;
    term.insertAdjacentHTML('beforeend', html);
    scrollBottom();
    return document.getElementById(bodyId);
  }

  // ── Create a turn block inside a session ───────────────────
  function createTurn(sessionBody, turn, command, timestamp) {
    const turnId   = 'turn-' + turn;
    const bodyId   = 'turn-body-' + turn;
    const toggleId = 'turn-tog-' + turn;
    const html = `
      <div class="turn-block" id="${turnId}">
        <div class="turn-header" onclick="toggleBlock('${bodyId}','${toggleId}')">
          <span class="turn-toggle" id="${toggleId}">▼</span>
          <span class="turn-label">Turn ${turn}</span>
          <span class="turn-cmd-preview">$ ${esc(command)}</span>
          <span class="turn-time">${ts(timestamp)}</span>
        </div>
        <div class="turn-body" id="${bodyId}">
          <div class="cmd-block">
            <span class="cmd-prompt">admin@webserver-prod:~$ </span>
            <span class="cmd-text">${esc(command)}</span>
          </div>
          <div id="turn-think-${turn}" class="thinking-row">
            <div class="spinner"></div> Waiting for target response…
          </div>
        </div>
      </div>`;
    sessionBody.insertAdjacentHTML('beforeend', html);
    scrollBottom();
  }

  // ── Append output to a turn ────────────────────────────────
  function attachOutput(turn, output, timestamp) {
    const thinkEl = document.getElementById('turn-think-' + turn);
    if (thinkEl) thinkEl.remove();
    const bodyEl = document.getElementById('turn-body-' + turn);
    if (bodyEl) {
      bodyEl.insertAdjacentHTML('beforeend',
        `<div class="out-block">${esc(output||'(no output)')}</div>`);
      if (autoScroll) bodyEl.scrollIntoView({ behavior:'smooth', block:'end' });
    }
  }

  // ── Main event dispatcher ──────────────────────────────────
  function appendEvent(ev) {
    const type = ev.event;
    if (type === 'ping') return;

    if (type === 'session_start') {
      document.getElementById('stat-scenario').textContent = ev.scenario || '—';
      document.getElementById('stat-target').textContent   = ev.target   || '—';
      document.getElementById('stat-status').textContent   = 'Running';
      document.getElementById('stat-status').style.color   = 'var(--green)';
      document.getElementById('target-badge').textContent  = 'Target: ' + (ev.target || '—');

      const id = ev.timestamp || Date.now();
      currentSession = id;
      sessions[id] = { body: createSession(id, ev.scenario||'', ev.target||'', ev.timestamp), turnCount: 0 };
      return;
    }

    if (type === 'command_sent') {
      cmdCount++;
      document.getElementById('stat-cmds').textContent = cmdCount;
      document.getElementById('stat-turn').textContent = ev.turn || cmdCount;

      // If there's no current session yet (e.g. history replay), create one
      if (!currentSession) {
        currentSession = 'default';
        sessions[currentSession] = {
          body: createSession('default', 'Replayed session', '—', ev.timestamp),
          turnCount: 0
        };
      }
      const sess = sessions[currentSession];
      sess.turnCount++;
      createTurn(sess.body, ev.turn, ev.command, ev.timestamp);
      return;
    }

    if (type === 'output_received') {
      attachOutput(ev.turn, ev.output, ev.timestamp);
      return;
    }

    if (type === 'mission_complete') {
      document.getElementById('stat-status').textContent = 'Complete ✓';
      document.getElementById('stat-status').style.color = 'var(--green)';
      if (currentSession && sessions[currentSession]) {
        sessions[currentSession].body.insertAdjacentHTML('beforeend',
          `<div class="status-block status-complete">
            ✅ <strong>Mission Complete</strong> — ${ev.turns} turns executed
            <span style="font-size:10px;color:var(--muted);margin-left:auto">${ts(ev.timestamp)}</span>
          </div>`);
        scrollBottom();
      }
      currentSession = null;
      return;
    }
  }

  // ── SSE connection ─────────────────────────────────────────
  function connect() {
    const es = new EventSource('/stream');
    es.onopen = () => {
      dot.classList.add('live');
      document.getElementById('conn-label').textContent = 'Live';
    };
    es.onmessage = (e) => {
      try { appendEvent(JSON.parse(e.data)); } catch(_) {}
    };
    es.onerror = () => {
      dot.classList.remove('live');
      document.getElementById('conn-label').textContent = 'Reconnecting…';
      es.close();
      setTimeout(connect, 3000);
    };
  }

  connect();
</script>
</body>
</html>
